<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #202124;
        --panel: #292a2d;
        --text: #e8eaed;
        --text-muted: #9aa0a6;
        --accent-blue: #8ab4f8;
        --accent-red: #f28b82;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 280px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, "Google Sans", Roboto, system-ui, sans-serif;
      }

      /* Chrome's popup window itself is a plain rectangle Chrome controls,
         not something a page can round via CSS. Instead, the rounded look
         lives on this inner panel, floating on the dark body background —
         the 15px margin also stands in for a gap below the toolbar icon. */
      .card {
        position: relative;
        z-index: 1;
        margin: 15px;
        padding: 18px;
        background: var(--panel);
        border-radius: 16px;
        overflow: hidden;
      }

      /* Abstract ChromeOS-style wallpaper blobs, pure CSS, no image assets. */
      .card::before,
      .card::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(30px);
        opacity: 0.25;
        pointer-events: none;
        z-index: 0;
      }
      .card::before {
        width: 160px;
        height: 160px;
        background: var(--accent-blue);
        top: -70px;
        right: -60px;
      }
      .card::after {
        width: 140px;
        height: 140px;
        background: var(--accent-red);
        bottom: -60px;
        left: -50px;
        opacity: 0.15;
      }

      .row,
      button#toggle,
      #error,
      #limit-note,
      #disclaimer {
        position: relative;
        z-index: 1;
      }

      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 16px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--text-muted);
        margin-top: 5px;
        flex-shrink: 0;
      }
      body.recording .dot {
        background: var(--accent-red);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(242, 139, 130, 0.5);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(242, 139, 130, 0);
        }
      }

      .info {
        min-width: 0;
      }

      #title {
        font-weight: 500;
        font-size: 14px;
        word-break: break-word;
      }

      #status {
        color: var(--text-muted);
        font-size: 12px;
        margin-top: 2px;
        min-height: 1.2em;
      }

      button#toggle {
        display: block;
        width: fit-content;
        margin: 0 auto;
        padding: 11px 22px;
        border: none;
        border-radius: 999px;
        background: var(--accent-blue);
        color: #202124;
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition:
          filter 0.15s ease,
          transform 0.1s ease;
      }
      button#toggle:hover:not(:disabled) {
        filter: brightness(1.08);
      }
      button#toggle:active:not(:disabled) {
        transform: scale(0.98);
      }
      button#toggle:disabled {
        opacity: 0.5;
        cursor: default;
      }
      body.recording button#toggle {
        background: var(--accent-red);
      }

      #error {
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(242, 139, 130, 0.12);
        color: var(--accent-red);
        font-size: 12px;
        display: none;
      }

      #hint {
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(138, 180, 248, 0.12);
        color: var(--accent-blue);
        font-size: 12px;
        display: none;
      }

      #limit-note {
        margin-top: 8px;
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
      }
      body.recording #limit-note {
        display: none;
      }

      #disclaimer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
        font-size: 10px;
        line-height: 1.4;
        color: var(--text-muted);
      }
      #disclaimer img {
        width: 12px;
        height: 12px;
        vertical-align: -1px;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <span class="dot" id="dot"></span>
        <div class="info">
          <div id="title">Cargando…</div>
          <div id="status"></div>
        </div>
      </div>
      <div id="hint"></div>
      <button id="toggle" disabled>Empezar grabación</button>
      <div id="limit-note">Puedes grabar 2 min máximo</div>
      <div id="error"></div>
      <div id="disclaimer"><img src="icons/favicon.ico" alt="" />Herramienta de uso educativo.</div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
